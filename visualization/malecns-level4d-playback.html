        s += lane(&quot;KC→MBON weights&quot;,218);
        const changeX = isTrain ? x(500) : xLeft;
        s += `&lt;line x1=&quot;${xLeft}&quot; y1=&quot;224&quot; x2=&quot;${xRight}&quot; y2=&quot;224&quot; stroke=&quot;var(--border)&quot; stroke-opacity=&quot;0.4&quot;/&gt;`;
        if (isTrain) {
          s += `&lt;line x1=&quot;${changeX}&quot; y1=&quot;215&quot; x2=&quot;${changeX}&quot; y2=&quot;233&quot; stroke=&quot;var(--viz-series-2)&quot; stroke-width=&quot;2&quot; stroke-opacity=&quot;${ms&gt;=gateMs?1:.28}&quot;/&gt;&lt;text x=&quot;${xLeft}&quot; y=&quot;241&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot;&gt;${item.changes} edge updates at DAN gate ${gateMs} ms · block ${item.block}, presentation ${item.presentation}&lt;/text&gt;`;
        } else {
          s += `&lt;text x=&quot;${xLeft}&quot; y=&quot;241&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot;&gt;Frozen final vector · 32 edges · no evaluation updates&lt;/text&gt;`;
        }
        // A compact indexed weight strip shows the edge vector used at the current playback time.
        const maxW = Math.max(...weights, 1e-9);
        const cellW = plotW / 32;
        weights.forEach((v,i) =&gt; {
          const bh = 12 * v / maxW;
          const xx = xLeft + i*cellW + 0.5;
          s += `&lt;rect x=&quot;${xx}&quot; y=&quot;${257-bh}&quot; width=&quot;${Math.max(2,cellW-1)}&quot; height=&quot;${bh}&quot; fill=&quot;var(--viz-series-1)&quot; fill-opacity=&quot;0.78&quot;&gt;&lt;title&gt;KC ${data.kcIds[i]} → MBON05 · ${fmt(v,6)} mV-equivalent&lt;/title&gt;&lt;/rect&gt;`;
        });
        s += lane(&quot;MBON05 · mV&quot;,278);
        if (isTrain) {
          s += `&lt;text x=&quot;${xLeft}&quot; y=&quot;291&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;11&quot;&gt;No MBON voltage trace was recorded for this teaching presentation&lt;/text&gt;`;
        } else {
          const thresholdY = py(data.threshold);
          s += `&lt;line x1=&quot;${xLeft}&quot; y1=&quot;${thresholdY}&quot; x2=&quot;${xRight}&quot; y2=&quot;${thresholdY}&quot; stroke=&quot;var(--viz-series-2)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;${xRight}&quot; y=&quot;${thresholdY-4}&quot; text-anchor=&quot;end&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot;&gt;threshold ${fmt(data.threshold,6)}&lt;/text&gt;`;
          const path = trace.map((r,i)=&gt;`${i?&quot;L&quot;:&quot;M&quot;}${x(r[0])},${py(r[2])}`).join(&quot; &quot;);
          s += `&lt;path d=&quot;${path}&quot; fill=&quot;none&quot; stroke=&quot;var(--viz-series-1)&quot; stroke-width=&quot;1.6&quot;/&gt;`;
          const sample = trace[Math.min(trace.length-1, Math.max(0, Math.round(ms)-1))];
          if(sample) s += `&lt;circle cx=&quot;${x(sample[0])}&quot; cy=&quot;${py(sample[2])}&quot; r=&quot;3.5&quot; fill=&quot;var(--viz-series-1)&quot;&gt;&lt;title&gt;${sample[0]} ms · ${fmt(sample[2],6)} mV&lt;/title&gt;&lt;/circle&gt;`;
        }
        s += lane(&quot;fixed key output&quot;,350);
        s += `&lt;line x1=&quot;${xLeft}&quot; y1=&quot;350&quot; x2=&quot;${xRight}&quot; y2=&quot;350&quot; stroke=&quot;var(--border)&quot;/&gt;`;
        if (action &amp;&amp; ms &gt;= action.time_us / 1000) {
          const at = action.time_us / 1000;
          s += `&lt;line x1=&quot;${x(at)}&quot; y1=&quot;342&quot; x2=&quot;${x(at)}&quot; y2=&quot;358&quot; stroke=&quot;var(--viz-series-3)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;${x(at)}&quot; y=&quot;374&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;11&quot;&gt;PRESS · x ${fmt(action.position,2)}&lt;/text&gt;`;
        } else if (action) {
          s += `&lt;text x=&quot;${xLeft}&quot; y=&quot;374&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;11&quot;&gt;IDLE · output event at ${Math.round(action.time_us/1000)} ms&lt;/text&gt;`;
        } else {
          s += `&lt;text x=&quot;${xLeft}&quot; y=&quot;374&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;11&quot;&gt;IDLE · no action event&lt;/text&gt;`;
        }
        for (const t of [0,100,200,300,400,500]) {
          s += `&lt;line x1=&quot;${x(t)}&quot; y1=&quot;382&quot; x2=&quot;${x(t)}&quot; y2=&quot;386&quot; stroke=&quot;var(--border)&quot;/&gt;&lt;text x=&quot;${x(t)}&quot; y=&quot;402&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot;&gt;${t}&lt;/text&gt;`;
        }
        s += `&lt;text x=&quot;${(xLeft+xRight)/2}&quot; y=&quot;420&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;11&quot;&gt;time in moving note (ms)&lt;/text&gt;`;
        svg.setAttribute(&quot;viewBox&quot;, `0 0 ${w} ${h}`);
        svg.setAttribute(&quot;width&quot;, &quot;100%&quot;); svg.setAttribute(&quot;height&quot;, h);
        svg.innerHTML = s;
        timeLabel.value = `${ms} ms`; timeLabel.textContent = `${ms} ms`;
        blockLabel.hidden = modeInput.value !== &quot;train&quot; || !arm.training.length;
        blockInput.max = String(Math.max(1, arm.training.length));
        const xTxt = fmt(posX,3);
        if (isTrain) {
          const danCount = dans.filter(d=&gt;d[1].some(t=&gt;t&lt;=ms)).length;
          status.textContent = `${arm.label} · block ${item.block} · presentation ${item.presentation} · x=${xTxt} · ${events.filter(e=&gt;e[0]&lt;=ms).length}/${events.length} KC spikes · ${danCount}/${dans.length} DAN cells spiked · ${ms&gt;=gateMs?item.changes+&quot; weight updates after DAN gate&quot;:&quot;weights held before DAN gate&quot;}`;
        } else {
          const evalAction = action &amp;&amp; ms&gt;=action.time_us/1000 ? &quot;action event recorded&quot; : &quot;no output event yet&quot;;
          status.textContent = `${arm.label} · frozen weights · DAN/plasticity off · x=${xTxt} · ${events.filter(e=&gt;e[0]&lt;=ms).length}/${events.length} KC spikes · MBON05 ${fmt((trace[Math.min(trace.length-1,Math.max(0,Math.round(ms)-1))]||[0,0,0])[2],6)} mV · ${evalAction}`;
        }
      }
      function stop() { if(animation) cancelAnimationFrame(animation); animation=null; playButton.textContent=&quot;Play&quot;; playButton.setAttribute(&quot;aria-pressed&quot;,&quot;false&quot;); }
      function play() {
        if(animation) { stop(); return; }
        if(Number(timeInput.value)&gt;=500) timeInput.value=&quot;0&quot;;
        const start = performance.now() - Number(timeInput.value);
        playButton.textContent=&quot;Pause&quot;; playButton.setAttribute(&quot;aria-pressed&quot;,&quot;true&quot;);
        const step = now =&gt; {
          const t = Math.min(500, Math.floor(now-start));
          if(Number(timeInput.value)!==t) { timeInput.value=String(t); update(); }
          if(t&gt;=500) { stop(); return; }
          animation=requestAnimationFrame(step);
        };
        animation=requestAnimationFrame(step);
      }
      armInput.addEventListener(&quot;change&quot;,()=&gt;{ stop(); timeInput.value=&quot;0&quot;; blockInput.value=&quot;1&quot;; update(); });
      modeInput.addEventListener(&quot;change&quot;,()=&gt;{ stop(); timeInput.value=&quot;0&quot;; update(); });
      blockInput.addEventListener(&quot;input&quot;,()=&gt;{ stop(); timeInput.value=&quot;0&quot;; update(); });
      timeInput.addEventListener(&quot;input&quot;,()=&gt;{ stop(); update(); });
      playButton.addEventListener(&quot;click&quot;,play);
      new ResizeObserver(update).observe(root);
      update();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;div id=&quot;malecns-learning-view&quot;&gt;
  &lt;h2&gt;Level 1 static learning view&lt;/h2&gt;
  &lt;div class=&quot;viz-controls&quot;&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;mlv-arm&quot;&gt;Training condition
      &lt;select class=&quot;form-select&quot; id=&quot;mlv-arm&quot;&gt;
        &lt;option value=&quot;baseline&quot;&gt;Before training&lt;/option&gt;
        &lt;option value=&quot;a&quot;&gt;Teacher on state A&lt;/option&gt;
        &lt;option value=&quot;off&quot;&gt;Plasticity off&lt;/option&gt;
        &lt;option value=&quot;b&quot;&gt;Teacher on state B&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;mlv-state&quot;&gt;State presented
      &lt;select class=&quot;form-select&quot; id=&quot;mlv-state&quot;&gt;
        &lt;option value=&quot;A&quot;&gt;A · target&lt;/option&gt;
        &lt;option value=&quot;B&quot;&gt;B · control&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;p id=&quot;mlv-headline&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
  &lt;svg id=&quot;mlv-circuit&quot; role=&quot;img&quot; aria-labelledby=&quot;mlv-circuit-title mlv-circuit-desc&quot;&gt;
    &lt;title id=&quot;mlv-circuit-title&quot;&gt;Eight selected Kenyon cells connect to MBON05&lt;/title&gt;
    &lt;desc id=&quot;mlv-circuit-desc&quot;&gt;The selected state activates four Kenyon cells. Edge width shows current synaptic weight for the chosen training condition.&lt;/desc&gt;
  &lt;/svg&gt;

  &lt;h3&gt;Pretraining controllability&lt;/h3&gt;
  &lt;svg id=&quot;mlv-probe&quot; role=&quot;img&quot; aria-labelledby=&quot;mlv-probe-title mlv-probe-desc&quot;&gt;
    &lt;title id=&quot;mlv-probe-title&quot;&gt;MBON activity as KC to MBON weights decrease&lt;/title&gt;
    &lt;desc id=&quot;mlv-probe-desc&quot;&gt;Five measured MBON maximum-voltage responses decrease monotonically from multiplier one to 0.2. A dashed line marks the frozen action threshold.&lt;/desc&gt;
  &lt;/svg&gt;
  &lt;p class=&quot;text-muted&quot;&gt;Edge labels show audited plastic-contact count and modeled weight (mV-equivalent). MBON activity is maximum subthreshold voltage in the 100 ms window; threshold and action mapping are engineering assumptions.&lt;/p&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;malecns-learning-view&quot;);
      const armInput = document.getElementById(&quot;mlv-arm&quot;);
      const stateInput = document.getElementById(&quot;mlv-state&quot;);
      const circuit = document.getElementById(&quot;mlv-circuit&quot;);
      const probe = document.getElementById(&quot;mlv-probe&quot;);
      const headline = document.getElementById(&quot;mlv-headline&quot;);
      const threshold = 0.13266897755112178;
      const ids = [19083, 33808, 37916, 38113, 38549, 38962, 39531, 41131];
      const initial = [0.13157894736842105, 0.25, 0.2894736842105263, 0.32894736842105265,
        0.25, 0.18181818181818182, 0.2840909090909091, 0.2840909090909091];
      const depressedA = [0.02631578947368421, 0.05, 0.05789473684210527, 0.06578947368421054,
        0.25, 0.18181818181818182, 0.2840909090909091, 0.2840909090909091];
      const depressedB = [0.13157894736842105, 0.25, 0.2894736842105263, 0.32894736842105265,
        0.05, 0.03636363636363637, 0.05681818181818182, 0.05681818181818182];
      const contacts = [10, 19, 22, 25, 22, 16, 25, 25];
      const responses = {
        baseline: { A: 0.18952711078731685, B: 0.18952711078731685 },
        a: { A: 0.03790542215746336, B: 0.18952711078731685 },
        off: { A: 0.18952711078731685, B: 0.18952711078731685 },
        b: { A: 0.18952711078731685, B: 0.03790542215746336 }
      };
      const arms = { baseline: initial, a: depressedA, off: initial, b: depressedB };
      const probeValues = [
        { x: 1.0, y: 0.18952711078731685 },
        { x: 0.8, y: 0.15162168862985345 },
        { x: 0.6, y: 0.1137162664723901 },
        { x: 0.4, y: 0.07581084431492673 },
        { x: 0.2, y: 0.03790542215746336 }
      ];
      const series = [&quot;var(--viz-series-1)&quot;, &quot;var(--viz-series-2)&quot;];
      const fmt = value =&gt; value.toFixed(6);

      function renderCircuit() {
        const w = Math.max(320, Math.floor(circuit.getBoundingClientRect().width));
        const narrow = w &lt; 560;
        const h = narrow ? 410 : 330;
        circuit.setAttribute(&quot;viewBox&quot;, `0 0 ${w} ${h}`);
        circuit.setAttribute(&quot;width&quot;, &quot;100%&quot;);
        circuit.setAttribute(&quot;height&quot;, h);
        const arm = armInput.value;
        const state = stateInput.value;
        const weights = arms[arm];
        const activity = responses[arm][state];
        const stateIndex = state === &quot;A&quot; ? 0 : 1;
        const labelX = narrow ? 42 : w * 0.075;
        const nodeX = labelX - 16;
        const edgeX = narrow ? w * 0.68 : w * 0.37;
        const labelEdgeX = labelX + (narrow ? 145 : 170);
        const busX = narrow ? w * 0.75 : w * 0.63;
        const mbonX = narrow ? w * 0.84 : w * 0.69;
        const plotX = narrow ? 18 : w * 0.77;
        const trackW = narrow ? w - 36 : w * 0.20;
        const trackY = narrow ? 348 : 148;
        const rows = narrow ? [55, 82, 109, 136, 194, 221, 248, 275]
                            : [54, 82, 110, 138, 194, 222, 250, 278];
        const activeColor = series[stateIndex];
        let marks = `&lt;text x=&quot;${nodeX}&quot; y=&quot;28&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;13&quot;&gt;STATE A · target&lt;/text&gt;`;
        marks += `&lt;text x=&quot;${nodeX}&quot; y=&quot;168&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;13&quot;&gt;STATE B · control&lt;/text&gt;`;
        marks += `&lt;text x=&quot;${mbonX}&quot; y=&quot;28&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;MBON05 · 10495&lt;/text&gt;`;
        marks += `&lt;line x1=&quot;${busX}&quot; y1=&quot;${rows[0]}&quot; x2=&quot;${busX}&quot; y2=&quot;${rows[7]}&quot; stroke=&quot;var(--border)&quot; stroke-width=&quot;1.5&quot;/&gt;`;
        marks += `&lt;line x1=&quot;${busX}&quot; y1=&quot;180&quot; x2=&quot;${mbonX - 18}&quot; y2=&quot;180&quot; stroke=&quot;var(--border)&quot; stroke-width=&quot;1.5&quot;/&gt;`;
        for (let i = 0; i &lt; ids.length; i++) {
          const group = i &lt; 4 ? 0 : 1;
          const y = rows[i];
          const edgeOpacity = group === stateIndex ? 0.92 : 0.22;
          const edgeWidth = 1 + 12 * weights[i];
          const weightText = weights[i].toFixed(3);
          marks += `&lt;line x1=&quot;${labelEdgeX}&quot; y1=&quot;${y}&quot; x2=&quot;${edgeX}&quot; y2=&quot;${y}&quot; stroke=&quot;${series[group]}&quot; stroke-width=&quot;${Math.max(1, edgeWidth * 0.65)}&quot; stroke-linecap=&quot;round&quot; opacity=&quot;${edgeOpacity}&quot;/&gt;`;
          marks += `&lt;line x1=&quot;${edgeX}&quot; y1=&quot;${y}&quot; x2=&quot;${busX}&quot; y2=&quot;${y}&quot; stroke=&quot;${series[group]}&quot; stroke-width=&quot;${edgeWidth}&quot; stroke-linecap=&quot;round&quot; opacity=&quot;${edgeOpacity}&quot;/&gt;`;
          marks += `&lt;circle cx=&quot;${nodeX}&quot; cy=&quot;${y - 3}&quot; r=&quot;5&quot; fill=&quot;${series[group]}&quot; fill-opacity=&quot;${group === stateIndex ? 1 : 0.45}&quot;/&gt;`;
          marks += `&lt;text x=&quot;${labelX}&quot; y=&quot;${y + 4}&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;${narrow ? 11 : 12}&quot;&gt;KC ${ids[i]} · ${contacts[i]}c · w ${weightText}&lt;/text&gt;`;
        }
        marks += `&lt;circle cx=&quot;${mbonX}&quot; cy=&quot;${narrow ? 181 : 180}&quot; r=&quot;18&quot; fill=&quot;var(--muted)&quot; stroke=&quot;var(--border)&quot;/&gt;`;
        marks += `&lt;text x=&quot;${mbonX}&quot; y=&quot;${narrow ? 185 : 184}&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;M&lt;/text&gt;`;
        marks += `&lt;text x=&quot;${plotX}&quot; y=&quot;${narrow ? 333 : 102}&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;13&quot;&gt;MBON response&lt;/text&gt;`;
        marks += `&lt;text x=&quot;${plotX}&quot; y=&quot;${narrow ? 345 : 124}&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;11&quot;&gt;max voltage · mV-equivalent&lt;/text&gt;`;
        marks += `&lt;rect x=&quot;${plotX}&quot; y=&quot;${trackY}&quot; width=&quot;${trackW}&quot; height=&quot;12&quot; rx=&quot;6&quot; fill=&quot;var(--muted)&quot;/&gt;`;
        const thresholdX = plotX + trackW * threshold / 0.2;
        const valueW = trackW * activity / 0.2;
        marks += `&lt;line x1=&quot;${thresholdX}&quot; y1=&quot;${trackY - 9}&quot; x2=&quot;${thresholdX}&quot; y2=&quot;${trackY + 22}&quot; stroke=&quot;var(--foreground)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;`;
        marks += `&lt;rect x=&quot;${plotX}&quot; y=&quot;${trackY}&quot; width=&quot;${valueW}&quot; height=&quot;12&quot; rx=&quot;6&quot; fill=&quot;${activeColor}&quot;/&gt;`;
        marks += `&lt;text x=&quot;${plotX}&quot; y=&quot;${trackY + 39}&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;13&quot;&gt;${fmt(activity)} · ${activity &lt;= threshold ? &quot;ACTION&quot; : &quot;NO ACTION&quot;}&lt;/text&gt;`;
        marks += `&lt;text x=&quot;${thresholdX}&quot; y=&quot;${trackY + 56}&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot;&gt;threshold&lt;/text&gt;`;
        marks += `&lt;text x=&quot;${plotX}&quot; y=&quot;${trackY + 79}&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;11&quot;&gt;${state === &quot;A&quot; ? &quot;A target&quot; : &quot;B control&quot;} · ${arm === &quot;a&quot; ? &quot;A taught&quot; : arm === &quot;b&quot; ? &quot;B taught&quot; : arm === &quot;off&quot; ? &quot;plasticity off&quot; : &quot;baseline&quot;}&lt;/text&gt;`;
        circuit.innerHTML = `&lt;title id=&quot;mlv-circuit-title&quot;&gt;Selected ${state} input under ${armInput.options[armInput.selectedIndex].text}&lt;/title&gt;&lt;desc id=&quot;mlv-circuit-desc&quot;&gt;Eight measured KC to MBON05 connections are shown. Highlighted ${state} ensemble is active. Edge widths show current weight. MBON activity is ${fmt(activity)} millivolts equivalent; threshold is ${fmt(threshold)}.&lt;/desc&gt;${marks}`;
        headline.textContent = `MBON05 · ${state} presented · ${armInput.options[armInput.selectedIndex].text} · ${activity &lt;= threshold ? &quot;ACTION&quot; : &quot;NO ACTION&quot;}`;
      }

      function renderProbe() {
        const w = Math.max(320, Math.floor(probe.getBoundingClientRect().width));
        const h = 220;
        probe.setAttribute(&quot;viewBox&quot;, `0 0 ${w} ${h}`);
        probe.setAttribute(&quot;width&quot;, &quot;100%&quot;);
        probe.setAttribute(&quot;height&quot;, h);
        const left = w &lt; 500 ? 56 : 68;
        const right = 14;
        const top = 16;
        const bottom = 46;
        const innerW = w - left - right;
        const innerH = h - top - bottom;
        const maxY = Math.max(...probeValues.map(point =&gt; point.y), threshold) * 1.12;
        const px = x =&gt; left + ((1.0 - x) / 0.8) * innerW;
        const py = y =&gt; top + (1 - y / maxY) * innerH;
        let marks = `&lt;rect data-chart-frame=&quot;true&quot; x=&quot;${left}&quot; y=&quot;${top}&quot; width=&quot;${innerW}&quot; height=&quot;${innerH}&quot; fill=&quot;none&quot; stroke=&quot;var(--border)&quot;/&gt;`;
        for (const tick of [0, 0.05, 0.10, 0.15, 0.20]) {
          const y = py(tick);
          marks += `&lt;line x1=&quot;${left}&quot; y1=&quot;${y}&quot; x2=&quot;${w - right}&quot; y2=&quot;${y}&quot; stroke=&quot;var(--border)&quot; stroke-opacity=&quot;0.45&quot;/&gt;`;
          marks += `&lt;text x=&quot;${left - 8}&quot; y=&quot;${y + 4}&quot; text-anchor=&quot;end&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;12&quot;&gt;${tick.toFixed(2)}&lt;/text&gt;`;
        }
        const thresholdY = py(threshold);
        marks += `&lt;line x1=&quot;${left}&quot; y1=&quot;${thresholdY}&quot; x2=&quot;${w - right}&quot; y2=&quot;${thresholdY}&quot; stroke=&quot;var(--viz-series-2)&quot; stroke-dasharray=&quot;5 4&quot;/&gt;`;
        marks += `&lt;text x=&quot;${w - right - 2}&quot; y=&quot;${thresholdY - 6}&quot; text-anchor=&quot;end&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;11&quot;&gt;threshold ${threshold.toFixed(3)}&lt;/text&gt;`;
        const path = probeValues.map((point, index) =&gt; `${index ? &quot;L&quot; : &quot;M&quot;}${px(point.x)},${py(point.y)}`).join(&quot; &quot;);
        marks += `&lt;path d=&quot;${path}&quot; fill=&quot;none&quot; stroke=&quot;var(--viz-series-1)&quot; stroke-width=&quot;2&quot;/&gt;`;
        for (const point of probeValues) {
          const x = px(point.x);
          const y = py(point.y);
          marks += `&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;4&quot; fill=&quot;var(--viz-series-1)&quot; data-tooltip=&quot;Weight multiplier ${point.x.toFixed(1)}; MBON ${fmt(point.y)} mV-equivalent&quot;/&gt;`;
          marks += `&lt;text x=&quot;${x}&quot; y=&quot;${h - 25}&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--foreground)&quot; font-size=&quot;12&quot;&gt;${point.x.toFixed(1)}&lt;/text&gt;`;
        }

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true

      }

      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);

  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");

    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });

    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],

    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
